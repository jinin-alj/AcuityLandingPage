<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>You're confirmed — Acuity.</title>
  <link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    @font-face{font-family:'Manrope';font-weight:500;src:url('assets/fonts/Manrope-Medium.ttf') format('truetype');font-display:swap;}
    @font-face{font-family:'Manrope';font-weight:600;src:url('assets/fonts/Manrope-SemiBold.ttf') format('truetype');font-display:swap;}
    @font-face{font-family:'Manrope';font-weight:700;src:url('assets/fonts/Manrope-Bold.ttf') format('truetype');font-display:swap;}
    @font-face{font-family:'Manrope';font-weight:800;src:url('assets/fonts/Manrope-ExtraBold.ttf') format('truetype');font-display:swap;}
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{--cream:#F1ECE2;--blue:#2C4FB2;--blue-deep:#21307C;--salmon:#CE7C6A;--red:#E14B4B;}
    body{font-family:'Manrope',system-ui,sans-serif;background:var(--cream);color:#2c2c33;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden;position:relative;}
    .bg-top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(1500px,135vw);aspect-ratio:1024/360;background:url('assets/backgrounds/semi circle.png') top center/contain no-repeat;z-index:0;pointer-events:none;}
    .bg-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1700px,150vw);aspect-ratio:1024/120;background:url('assets/backgrounds/lower circle.png') bottom center/contain no-repeat;z-index:0;pointer-events:none;}
    .card{position:relative;z-index:2;max-width:600px;animation:pop .7s cubic-bezier(.22,1,.36,1);background:rgba(245,241,233,.82);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.6);border-radius:30px;padding:2.8rem 2.4rem;box-shadow:0 26px 70px rgba(40,30,25,.18);}
    @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96);}to{opacity:1;transform:none;}}
    .logo{width:90px;margin:0 auto 1.6rem;display:block;}
    .eyebrow{color:var(--salmon);font-weight:600;letter-spacing:.04em;font-size:1.2rem;margin-bottom:.8rem;}
    h1{font-weight:800;color:var(--blue-deep);font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.05;margin-bottom:1rem;letter-spacing:-.02em;}
    .dot{color:var(--red);}
    p.lead{color:#5c554c;font-weight:500;font-size:1.1rem;line-height:1.6;margin-bottom:2rem;}
    .share{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:2rem;}
    .share-link{display:flex;align-items:center;background:rgba(255,255,255,.7);border:1.5px solid rgba(120,100,90,.2);border-radius:100px;padding:.65rem 1.2rem;font-weight:600;color:var(--blue);font-size:.9rem;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .btn{cursor:pointer;border:none;font-family:'Manrope';font-weight:600;padding:.8rem 1.8rem;border-radius:100px;font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;transition:transform .2s,box-shadow .25s,background .25s;}
    .btn:active{transform:scale(.96);}
    .btn-salmon{background:var(--salmon);color:#fff;box-shadow:0 8px 20px rgba(206,124,106,.4);}
    .btn-salmon:hover{background:#c87262;transform:translateY(-2px);}
    .btn-blue{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(44,79,178,.35);}
    .btn-blue:hover{background:#2747a0;transform:translateY(-2px);}
    .home-link{display:inline-block;margin-top:1.6rem;color:#8a8176;text-decoration:none;font-weight:500;font-size:.92rem;}
    .home-link:hover{color:var(--blue);}
  </style>
</head>
<body>
  <div class="bg-top"></div>
  <div class="bg-bottom"></div>
  <div class="card">
    <img src="assets/logo/logo.svg" alt="Acuity" class="logo">
    <p class="eyebrow">Email confirmed</p>
    <h1>You're officially locked in<span class="dot">.</span></h1>
    <p class="lead">Thanks for verifying your email. You'll be among the first to get access when Acuity launches.<br><br>Want in sooner? Every friend who joins through your link moves you up the list.</p>
    <div class="share">
      <span class="share-link" id="shareLink">https://acuity.app/?ref=…</span>
      <button class="btn btn-blue" id="copyShare">Copy link</button>
      <button class="btn btn-salmon" id="shareNative">Share</button>
    </div>
    <a href="index.html" class="home-link">← Back to the site</a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/analytics.js"></script>
  <script>
    (function(){
      var cfg=window.ACUITY_CONFIG||{};
      var params=new URLSearchParams(location.search);
      var code=params.get('ref')||'welcome';
      var base=(cfg.SITE_URL||location.origin).replace(/\/$/,'');
      var link=base+'/?ref='+encodeURIComponent(code);
      var el=document.getElementById('shareLink');
      el.textContent=link; el.title=link;
      if(window.track) window.track('email_confirmed',{});
      document.getElementById('copyShare').addEventListener('click',function(){
        if(window.track) window.track('referral_share',{method:'copy'});
        navigator.clipboard&&navigator.clipboard.writeText(link).then(function(){
          var b=document.getElementById('copyShare');var t=b.textContent;b.textContent='Copied!';setTimeout(function(){b.textContent=t;},1800);
        });
      });
      document.getElementById('shareNative').addEventListener('click',function(){
        if(window.track) window.track('referral_share',{method:'native'});
        var data={title:'Acuity',text:'I just joined the Acuity waitlist — the science of staying focused. Join me:',url:link};
        if(navigator.share){navigator.share(data).catch(function(){});}
        else if(navigator.clipboard){navigator.clipboard.writeText(link);}
      });
    })();
  </script>
</body>
</html>
